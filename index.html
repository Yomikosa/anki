<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>公式暗記帳 — スタサプ風タップ穴埋め・APIキー不要</title>
    <meta
      name="description"
      content="デジタル庁デザインシステム（DADS）準拠・透明感ガラスデザインの公式暗記Webアプリ。PC専用・スマホ専用UI、Gemini JSONコピペ連携、KaTeXタップ穴埋め対応。"
    />

    <!-- Google Fonts: DADS公式書体 Noto Sans JP / Noto Sans Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Noto+Sans+Mono:wght@400;700&display=swap"
    />

    <!-- KaTeX CDN -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css"
      crossorigin="anonymous"
    />
    <script
      defer
      src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"
      crossorigin="anonymous"
    ></script>

    <!-- DADSトークン・コンポーネント・共通・PC専用・スマホ専用スタイル -->
    <link rel="stylesheet" href="./css/tokens.css" />
    <link rel="stylesheet" href="./css/dads-components.css" />
    <link rel="stylesheet" href="./css/app.css" />
    <link rel="stylesheet" href="./css/layout-pc.css" />
    <link rel="stylesheet" href="./css/layout-mobile.css" />

    <script type="module" src="./js/app.js"></script>
  </head>
  <body>
    <a href="#main-content" class="skip-link">本文へスキップ</a>

    <div class="app-shell">
      <!-- ================================================================
           PC専用UI：左フロストガラス・サイドバーナビゲーション（900px以上）
           ================================================================ -->
      <aside class="pc-sidebar" aria-label="メインナビゲーション（PC）">
        <div>
          <div class="pc-sidebar__brand">
            <span class="app-brand__mark" aria-hidden="true">∫</span>
            <div>
              <p class="pc-sidebar__title">公式暗記帳</p>
              <p class="pc-sidebar__sub">タップ穴埋め学習</p>
            </div>
          </div>

          <nav class="pc-nav" aria-label="画面切り替え">
            <button type="button" id="pc-nav-home" class="pc-nav__item is-active" data-nav-target="home" aria-current="page">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M3 10.5L12 3L21 10.5V20C21 20.6 20.6 21 20 21H15V14.5H9V21H4C3.4 21 3 20.6 3 20V10.5Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round" />
              </svg>
              <span>ホーム</span>
            </button>

            <button type="button" id="pc-nav-study" class="pc-nav__item" data-nav-target="study" aria-current="false">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M4 5.5C4 4.7 4.7 4 5.5 4H11C12.7 4 14 5.3 14 7V20C14 18.9 13.1 18 12 18H5.5C4.7 18 4 17.3 4 16.5V5.5Z" stroke="currentColor" stroke-width="2" />
                <path d="M20 5.5C20 4.7 19.3 4 18.5 4H13C11.3 4 10 5.3 10 7V20C10 18.9 10.9 18 12 18H18.5C19.3 18 20 17.3 20 16.5V5.5Z" stroke="currentColor" stroke-width="2" />
              </svg>
              <span>学習する</span>
            </button>

            <button type="button" id="pc-nav-import" class="pc-nav__item" data-nav-target="import" aria-current="false">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M12 5V19M5 12H19" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" />
              </svg>
              <span>公式を追加</span>
            </button>

            <button type="button" id="pc-nav-manage" class="pc-nav__item" data-nav-target="manage" aria-current="false">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M8 6H20M8 12H20M8 18H20" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
                <circle cx="4" cy="6" r="1.25" fill="currentColor" />
                <circle cx="4" cy="12" r="1.25" fill="currentColor" />
                <circle cx="4" cy="18" r="1.25" fill="currentColor" />
              </svg>
              <span>一覧・管理</span>
              <span id="pc-nav-manage-count" class="pc-nav__count" aria-hidden="true">3</span>
            </button>
          </nav>
        </div>

        <div class="pc-sidebar__progress" aria-label="全体の習得状況">
          <div class="pc-sidebar__progress-top">
            <span>習得率</span>
            <strong id="pc-sidebar-rate">0%</strong>
          </div>
          <div class="dads-progress-track" aria-hidden="true">
            <div id="pc-sidebar-bar" class="dads-progress-bar" style="width: 0%"></div>
          </div>
          <p id="pc-sidebar-sub" class="pc-sidebar__progress-sub">習得 0 / 全 3 件</p>
        </div>
      </aside>

      <!-- ================================================================
           スマホ専用UI：スリムトップアプリバー（899px以下）
           ================================================================ -->
      <header class="mobile-topbar">
        <div class="mobile-topbar__left">
          <span class="mobile-topbar__mark" aria-hidden="true">∫</span>
          <p id="mobile-bar-title" class="mobile-topbar__title">公式暗記帳</p>
        </div>
        <div id="mobile-bar-action"></div>
      </header>

      <!-- ================================================================
           メインコンテンツ領域
           ================================================================ -->
      <div class="app-workspace">
        <main id="main-content" class="app-workspace__inner">
          <div class="pc-page-header">
            <h1 id="pc-page-title" class="pc-page-title">ホーム</h1>
          </div>

          <section id="view-home" data-view-panel="home" aria-label="ホーム画面"></section>
          <section id="view-study" data-view-panel="study" aria-label="学習画面" hidden></section>
          <section id="view-import" data-view-panel="import" aria-label="公式を追加画面" hidden></section>
          <section id="view-manage" data-view-panel="manage" aria-label="登録済み一覧・管理画面" hidden></section>
        </main>

        <footer class="app-footer">
          <span>データは端末の localStorage のみに保存されます</span>
          <span>
            準拠：
            <a href="https://design.digital.go.jp/dads/" target="_blank" rel="noopener noreferrer">
              デジタル庁デザインシステム（DADS）
            </a>
          </span>
        </footer>
      </div>

      <!-- ================================================================
           スマホ専用UI：DADS準拠 ボトムナビゲーション（899px以下）
           ================================================================ -->
      <nav class="mobile-bottom-nav" aria-label="メインナビゲーション（スマートフォン）">
        <button type="button" id="mobile-nav-home" class="mobile-bottom-nav__item is-active" data-nav-target="home" aria-current="page">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M3 10.5L12 3L21 10.5V20C21 20.6 20.6 21 20 21H15V14.5H9V21H4C3.4 21 3 20.6 3 20V10.5Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round" />
          </svg>
          <span>ホーム</span>
        </button>

        <button type="button" id="mobile-nav-study" class="mobile-bottom-nav__item" data-nav-target="study" aria-current="false">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M4 5.5C4 4.7 4.7 4 5.5 4H11C12.7 4 14 5.3 14 7V20C14 18.9 13.1 18 12 18H5.5C4.7 18 4 17.3 4 16.5V5.5Z" stroke="currentColor" stroke-width="2" />
            <path d="M20 5.5C20 4.7 19.3 4 18.5 4H13C11.3 4 10 5.3 10 7V20C10 18.9 10.9 18 12 18H18.5C19.3 18 20 17.3 20 16.5V5.5Z" stroke="currentColor" stroke-width="2" />
          </svg>
          <span>学習</span>
        </button>

        <button type="button" id="mobile-nav-import" class="mobile-bottom-nav__item" data-nav-target="import" aria-current="false">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M12 5V19M5 12H19" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" />
          </svg>
          <span>追加</span>
        </button>

        <button type="button" id="mobile-nav-manage" class="mobile-bottom-nav__item" data-nav-target="manage" aria-current="false">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M8 6H20M8 12H20M8 18H20" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
            <circle cx="4" cy="6" r="1.25" fill="currentColor" />
            <circle cx="4" cy="12" r="1.25" fill="currentColor" />
            <circle cx="4" cy="18" r="1.25" fill="currentColor" />
          </svg>
          <span>一覧</span>
        </button>
      </nav>
    </div>

    <!-- スマホ専用：学習条件・モード切替ボトムシート -->
    <dialog id="study-options-sheet" class="mobile-sheet" aria-labelledby="sheet-title">
      <div class="mobile-sheet__handle" aria-hidden="true"></div>
      <div class="mobile-sheet__header">
        <h2 id="sheet-title" class="dads-heading-sm" style="margin: 0">学習モード・絞り込み</h2>
        <button
          type="button"
          id="sheet-close-btn"
          class="dads-notification-banner__close"
          aria-label="閉じる"
          style="margin: 0"
        >
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M18 6L6 18M6 6L18 18" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" />
          </svg>
        </button>
      </div>
      <div id="study-options-sheet-body" class="mobile-sheet__body"></div>
    </dialog>

    <!-- 編集・手動追加モーダルダイアログ -->
    <dialog id="formula-edit-dialog" class="dads-dialog" aria-labelledby="edit-dialog-title">
      <div class="dads-dialog__header">
        <h2 id="edit-dialog-title" class="dads-heading-md" style="margin: 0">公式を編集</h2>
        <button
          type="button"
          id="edit-close-icon-btn"
          class="dads-notification-banner__close"
          aria-label="モーダルを閉じる"
          style="margin: 0"
        >
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M18 6L6 18M6 6L18 18" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" />
          </svg>
        </button>
      </div>

      <form id="formula-edit-form" novalidate>
        <div class="dads-dialog__body">
          <div id="edit-error-slot" class="banner-slot" style="margin-top: 0"></div>

          <div class="dads-form-field">
            <label for="edit-title" class="dads-form-label">
              公式名
              <span class="dads-requirement-tag">必須</span>
            </label>
            <input type="text" id="edit-title" class="dads-input" required placeholder="例：二次方程式の解の公式" />
          </div>

          <div class="edit-form-grid">
            <div class="dads-form-field">
              <label for="edit-subject" class="dads-form-label">科目</label>
              <input type="text" id="edit-subject" class="dads-input" placeholder="例：数学・物理・化学" />
            </div>

            <div class="dads-form-field">
              <label for="edit-category" class="dads-form-label">単元・分野</label>
              <input type="text" id="edit-category" class="dads-input" placeholder="例：二次方程式・力学" />
            </div>
          </div>

          <div class="dads-form-field">
            <label for="edit-question" class="dads-form-label">問題文（一問一答用）</label>
            <input
              type="text"
              id="edit-question"
              class="dads-input"
              placeholder="例：ax² + bx + c = 0 (a ≠ 0) の解 x を求めよ。"
            />
          </div>

          <div class="dads-form-field">
            <label for="edit-formula" class="dads-form-label">
              LaTeX数式（穴埋め箇所は <code>{{ }}</code> で囲む）
              <span class="dads-requirement-tag">必須</span>
            </label>
            <textarea
              id="edit-formula"
              class="dads-textarea dads-textarea--mono"
              rows="3"
              required
              spellcheck="false"
              placeholder="例：{{x}} = \frac{{-b \pm \sqrt{b^2 - 4ac}}}{{2a}}"
            ></textarea>
          </div>

          <div class="dads-form-field">
            <label for="edit-explanation" class="dads-form-label">
              解説（インライン数式は <code>$...$</code>、穴埋めは <code>{{ }}</code>）
            </label>
            <textarea
              id="edit-explanation"
              class="dads-textarea"
              rows="3"
              placeholder="例：判別式 $D = {{b^2 - 4ac}}$ が $0$ のとき{{重解}}をもつ。"
            ></textarea>
          </div>

          <div class="dads-form-field">
            <label for="edit-status" class="dads-form-label">学習ステータス</label>
            <select id="edit-status" class="dads-select">
              <option value="unlearned">未習得</option>
              <option value="review">復習が必要</option>
              <option value="mastered">習得済み</option>
            </select>
          </div>

          <div class="edit-preview-box" aria-live="polite">
            <p class="edit-preview-box__label">リアルタイム数式プレビュー（破線枠＝穴埋め対象）</p>
            <div id="edit-formula-preview" class="edit-preview-box__math"></div>
            <div id="edit-explanation-preview" class="edit-preview-box__exp"></div>
          </div>
        </div>

        <div class="dads-dialog__footer">
          <button type="button" id="edit-cancel-btn" class="dads-button" data-type="outline" data-size="md">
            キャンセル
          </button>
          <button type="submit" id="edit-save-btn" class="dads-button" data-type="solid-fill" data-size="md">
            保存する
          </button>
        </div>
      </form>
    </dialog>

    <!-- 確認モーダルダイアログ -->
    <dialog id="confirm-action-dialog" class="dads-dialog dads-dialog--sm" aria-labelledby="confirm-dialog-title">
      <div class="dads-dialog__header">
        <h2 id="confirm-dialog-title" class="dads-heading-sm" style="margin: 0">確認</h2>
      </div>
      <div class="dads-dialog__body">
        <p id="confirm-dialog-body" style="margin: 0"></p>
      </div>
      <div class="dads-dialog__footer">
        <button type="button" id="confirm-cancel-btn" class="dads-button" data-type="outline" data-size="md">
          キャンセル
        </button>
        <button
          type="button"
          id="confirm-ok-btn"
          class="dads-button dads-button--danger"
          data-type="solid-fill"
          data-size="md"
        >
          実行する
        </button>
      </div>
    </dialog>

    <div id="sr-live-region" class="sr-only" aria-live="polite" aria-atomic="true"></div>
  </body>
</html>
